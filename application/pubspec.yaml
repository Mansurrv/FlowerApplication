name: application
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.0
  http: ^1.1.0
  dio: ^5.0.0
  provider: ^6.1.5+1
  flutter_svg: ^2.0.9 
  shared_preferences: ^2.2.2
  image_picker: ^1.2.1
  intl: ^0.20.2
  syncfusion_flutter_charts: ^32.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#FFFFFF"
  image: images/splash.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: images/splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: images/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/svg1.svg
    - images/qwe1234.png
