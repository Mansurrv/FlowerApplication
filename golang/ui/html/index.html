<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users Page</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Splash -->
    <div class="splash" id="splash">
        <img src="/static/images/splash.png" alt="Splash Image">
    </div>

    <!-- Main Content -->
    <div class="content" id="content">

        <!-- Shared Wishlist View -->
        <div class="shared-wishlist" id="sharedWishlist" style="display: none;">
            <div class="shared-wishlist-header">Shared Wishlist</div>
            <div class="shared-wishlist-meta" id="sharedWishlistMeta"></div>
            <div class="shared-wishlist-items" id="sharedWishlistItems"></div>
        </div>

        <!-- Search -->
        <input type="text" placeholder="Search users..." class="search" id="searchInput">

        <!-- Users Container -->
        <div class="users-container" id="usersContainer"></div>

        <!-- Wishlist Form -->
        <div class="wishlist">
            <input type="text" placeholder="Your name" class="name-input" id="nameInput" list="userNames">
            <datalist id="userNames"></datalist>
            <textarea placeholder="Write your wishlist..." id="wishlistMessage"></textarea>
            <button id="sendWishlistBtn">Send</button>
        </div>

    </div>

    <script>
        window.addEventListener("load", function () {
            setTimeout(function () {
                document.getElementById("splash").style.display = "none";
                document.getElementById("content").style.display = "flex";
            }, 2000);
        });

        let users = [];
        let selectedUserId = null;

        function decodeBase64Url(input) {
            let str = input.replace(/-/g, "+").replace(/_/g, "/");
            while (str.length % 4) {
                str += "=";
            }
            try {
                return atob(str);
            } catch (e) {
                return "";
            }
        }

        function renderSharedWishlist(payload) {
            const section = document.getElementById("sharedWishlist");
            const meta = document.getElementById("sharedWishlistMeta");
            const itemsEl = document.getElementById("sharedWishlistItems");
            if (!payload || !Array.isArray(payload.items)) {
                return;
            }

            const name = payload.from || "Someone";
            const total = payload.total != null ? payload.total : "";
            const createdAt = payload.createdAt ? new Date(payload.createdAt).toLocaleString() : "";

            meta.textContent = `${name}'s wishlist${createdAt ? " • " + createdAt : ""}${total !== "" ? " • Total: ₸ " + total : ""}`;

            itemsEl.innerHTML = "";
            payload.items.forEach((item) => {
                const row = document.createElement("div");
                row.className = "shared-wishlist-item";
                const title = item.name || "Flower";
                const qty = item.quantity || 1;
                const price = item.price != null ? `₸ ${item.price}` : "";
                const florist = item.floristName ? ` • ${item.floristName}` : "";
                row.textContent = `${title} x${qty}${price ? " • " + price : ""}${florist}`;
                itemsEl.appendChild(row);
            });

            section.style.display = "flex";

            const search = document.getElementById("searchInput");
            const usersContainer = document.getElementById("usersContainer");
            const wishlistForm = document.querySelector(".wishlist");
            if (search) search.style.display = "none";
            if (usersContainer) usersContainer.style.display = "none";
            if (wishlistForm) wishlistForm.style.display = "none";
        }

        function tryLoadSharedWishlist() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get("items");
            if (!encoded) return;
            const decoded = decodeBase64Url(encoded);
            if (!decoded) return;
            try {
                const payload = JSON.parse(decoded);
                renderSharedWishlist(payload);
            } catch (e) {
                // ignore malformed payload
            }
        }

        function renderUsers(list) {
            const container = document.getElementById("usersContainer");
            container.innerHTML = "";

            if (!list.length) {
                const empty = document.createElement("div");
                empty.className = "user empty";
                empty.textContent = "No users found";
                container.appendChild(empty);
                return;
            }

            list.forEach((user) => {
                const id = user._id || user.id || "";
                const name = user.name || "Unknown User";
                const email = user.email || "";

                const row = document.createElement("div");
                row.className = "user";
                row.dataset.id = id;

                row.innerHTML = `
                    <div class="user-info">
                        <div class="user-name">${name}</div>
                        ${email ? `<div class="user-email">${email}</div>` : ""}
                    </div>
                `;

                row.addEventListener("click", () => {
                    selectedUserId = id;
                    document.querySelectorAll(".user").forEach((el) => {
                        el.classList.remove("selected");
                    });
                    row.classList.add("selected");
                });

                container.appendChild(row);
            });
        }

        function populateNameList(list) {
            const datalist = document.getElementById("userNames");
            datalist.innerHTML = "";
            list.forEach((user) => {
                if (!user.name) return;
                const option = document.createElement("option");
                option.value = user.name;
                datalist.appendChild(option);
            });
        }

        const API_PORT = "4040";
        const API_HOST = window.location.hostname || "localhost";
        const isFileProtocol = window.location.protocol === "file:";
        const isDevPort =
            window.location.port &&
            window.location.port !== "" &&
            window.location.port !== API_PORT;
        const API_BASE =
            isFileProtocol || isDevPort
                ? `http://${API_HOST}:${API_PORT}`
                : window.location.origin;

        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/api/users/?role=user`);
                const data = await res.json();
                users = Array.isArray(data) ? data : (data.data || []);
                renderUsers(users);
                populateNameList(users);
            } catch (e) {
                renderUsers([]);
            }
        }

        async function searchUsers(term) {
            const q = term.trim();
            if (!q) {
                loadUsers();
                return;
            }
            try {
                const res = await fetch(
                    `${API_BASE}/api/users/?role=user&q=${encodeURIComponent(q)}`
                );
                const data = await res.json();
                const list = Array.isArray(data) ? data : (data.data || []);
                users = list;
                renderUsers(list);
                populateNameList(list);
            } catch (e) {
                renderUsers([]);
            }
        }

        function findUserIdByName(name) {
            const normalized = name.trim().toLowerCase();
            if (!normalized) return "";
            const match = users.find((u) => (u.name || "").toLowerCase() === normalized);
            return match ? (match._id || match.id || "") : "";
        }

        async function sendWishlist() {
            const message = document.getElementById("wishlistMessage").value.trim();
            const nameInput = document.getElementById("nameInput").value;
            const fromUserId = findUserIdByName(nameInput);

            if (!fromUserId) {
                alert("Please enter your name exactly as it appears in the users list.");
                return;
            }
            if (!selectedUserId) {
                alert("Please select a user to send your wishlist.");
                return;
            }
            if (!message) {
                alert("Please write a wishlist message.");
                return;
            }

            const res = await fetch(`${API_BASE}/api/notifications/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    from_user: fromUserId,
                    to_user: selectedUserId,
                    message: message
                })
            });

            if (res.ok) {
                document.getElementById("wishlistMessage").value = "";
                alert("Wishlist sent!");
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.error || "Failed to send wishlist");
            }
        }

        document.getElementById("sendWishlistBtn").addEventListener("click", sendWishlist);
        let searchTimer = null;
        document.getElementById("searchInput").addEventListener("input", (e) => {
            if (searchTimer) {
                clearTimeout(searchTimer);
            }
            const value = e.target.value;
            searchTimer = setTimeout(() => {
                searchUsers(value);
            }, 300);
        });

        tryLoadSharedWishlist();
        loadUsers();
    </script>

</body>
</html>
