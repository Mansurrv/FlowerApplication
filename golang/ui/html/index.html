<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users Page</title>
    <link rel="stylesheet" href="/golang/ui/static/css/style.css">
</head>
<body>

    <!-- Splash -->
    <div class="splash" id="splash">
        <img src="/golang/ui/static/images/splash.png" alt="Splash Image">
    </div>

    <!-- Main Content -->
    <div class="content" id="content">

        <!-- Search -->
        <input type="text" placeholder="Search users..." class="search" id="searchInput">

        <!-- Users Container -->
        <div class="users-container" id="usersContainer"></div>

        <!-- Wishlist Form -->
        <div class="wishlist">
            <input type="text" placeholder="Your name" class="name-input" id="nameInput" list="userNames">
            <datalist id="userNames"></datalist>
            <textarea placeholder="Write your wishlist..." id="wishlistMessage"></textarea>
            <button id="sendWishlistBtn">Send</button>
        </div>

    </div>

    <script>
        window.addEventListener("load", function () {
            setTimeout(function () {
                document.getElementById("splash").style.display = "none";
                document.getElementById("content").style.display = "flex";
            }, 2000);
        });

        let users = [];
        let selectedUserId = null;

        function renderUsers(list) {
            const container = document.getElementById("usersContainer");
            container.innerHTML = "";

            if (!list.length) {
                const empty = document.createElement("div");
                empty.className = "user empty";
                empty.textContent = "No users found";
                container.appendChild(empty);
                return;
            }

            list.forEach((user) => {
                const id = user._id || user.id || "";
                const name = user.name || "Unknown User";
                const email = user.email || "";

                const row = document.createElement("div");
                row.className = "user";
                row.dataset.id = id;

                row.innerHTML = `
                    <div class="user-info">
                        <div class="user-name">${name}</div>
                        ${email ? `<div class="user-email">${email}</div>` : ""}
                    </div>
                `;

                row.addEventListener("click", () => {
                    selectedUserId = id;
                    document.querySelectorAll(".user").forEach((el) => {
                        el.classList.remove("selected");
                    });
                    row.classList.add("selected");
                });

                container.appendChild(row);
            });
        }

        function populateNameList(list) {
            const datalist = document.getElementById("userNames");
            datalist.innerHTML = "";
            list.forEach((user) => {
                if (!user.name) return;
                const option = document.createElement("option");
                option.value = user.name;
                datalist.appendChild(option);
            });
        }

        async function loadUsers() {
            try {
                const res = await fetch("/api/users");
                const data = await res.json();
                users = Array.isArray(data) ? data : (data.data || []);
                renderUsers(users);
                populateNameList(users);
            } catch (e) {
                renderUsers([]);
            }
        }

        function filterUsers(term) {
            const q = term.trim().toLowerCase();
            if (!q) {
                renderUsers(users);
                return;
            }
            const filtered = users.filter((user) => {
                const name = (user.name || "").toLowerCase();
                const email = (user.email || "").toLowerCase();
                return name.includes(q) || email.includes(q);
            });
            renderUsers(filtered);
        }

        function findUserIdByName(name) {
            const normalized = name.trim().toLowerCase();
            if (!normalized) return "";
            const match = users.find((u) => (u.name || "").toLowerCase() === normalized);
            return match ? (match._id || match.id || "") : "";
        }

        async function sendWishlist() {
            const message = document.getElementById("wishlistMessage").value.trim();
            const nameInput = document.getElementById("nameInput").value;
            const fromUserId = findUserIdByName(nameInput);

            if (!fromUserId) {
                alert("Please enter your name exactly as it appears in the users list.");
                return;
            }
            if (!selectedUserId) {
                alert("Please select a user to send your wishlist.");
                return;
            }
            if (!message) {
                alert("Please write a wishlist message.");
                return;
            }

            const res = await fetch("/api/notifications", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    from_user: fromUserId,
                    to_user: selectedUserId,
                    message: message
                })
            });

            if (res.ok) {
                document.getElementById("wishlistMessage").value = "";
                alert("Wishlist sent!");
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.error || "Failed to send wishlist");
            }
        }

        document.getElementById("sendWishlistBtn").addEventListener("click", sendWishlist);
        document.getElementById("searchInput").addEventListener("input", (e) => {
            filterUsers(e.target.value);
        });

        loadUsers();
    </script>

</body>
</html>
